apiVersion: v1
kind: ConfigMap
metadata:
  name: client-portal-v2-config
  namespace: client-portal
  labels:
    app.kubernetes.io/name: client-portal-v2
    app.kubernetes.io/part-of: client-portal
data:
  APP_NAME: "Client Portal"
  APP_ENV: "production"
  APP_DEBUG: "false"
  # Public hostname (placeholder - set the real one). Being https also makes Laravel
  # generate https asset/redirect URLs behind the proxy.
  APP_URL: "https://client-v2.skill-wanderer.com"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "client_portal_v2"
  DB_USERNAME: "client_portal_v2"
  SESSION_DRIVER: "database"
  SESSION_SECURE_COOKIE: "true"
  CACHE_STORE: "database"
  # No queue worker is deployed yet, so jobs run inline.
  QUEUE_CONNECTION: "sync"
  # Emails (password reset, verification) go to the pod log until SMTP is set up.
  MAIL_MAILER: "log"
